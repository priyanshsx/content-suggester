# Defaults for every client. A client's config.yaml overrides any of these.
# Lists are replaced, not merged: if a client sets "sources", it replaces this list.

languages: [en]
lookback_days: 7
threads_per_week: 10
max_per_author: 2
max_per_pillar: 4
max_items_per_run: 200

sources: [linkedin_search, sap_community, manual_paste]

# Who counts as a "buyer" author: the people the client most wants to be seen by.
audience: >-
  someone who could hire or buy from the client, talking about their own situation or team.

# What makes a post worth commenting on. Clients override this in their own config.
engagement_goal: >-
  Comment where the client can add real expertise to a conversation about one of its pillars:
  an answer, a lesson from experience, or a useful question.

query_templates:
  linkedin_search: 'site:linkedin.com/posts "{keyword}"'
  sap_community: 'site:community.sap.com "{keyword}"'

scoring:
  recency_half_life_days: 3
  points:
    relevant: 40
    pain_or_question: 20
    region_match: 10
    recency: 15
    engagement: 15
  author_type_points:
    buyer: 15
    peer: 5
    vendor: -10              # relevant vendor posts (e.g. SAP announcements) rank lower
    other: 0
