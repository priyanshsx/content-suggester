[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "content-suggester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "anthropic",
    "openai",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["suggester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]